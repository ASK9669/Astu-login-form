<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTU E-Student </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

    <style>
        body {
            background-color: #f8f9fa;
        }

        .btn:hover {
            background-color: blue;
            color: white;
        }
    </style>
</head>

<body class="bg-light">
    <div class="container mt-5 bg-light p-5 rounded shadow">
        <div class="row justify-content-center align-items-center">
            <div class="col-md-6">
                <img src="./photo_2026-04-25_21-10-35.jpg" alt="ASTU Logo" class="img-fluid mb-3 mx-auto d-block"
                    style="max-width: 90px;">
                <h3 class="text-center">ASTU E-Student</h3>

                <form id="loginForm" class="mt-4 p-4 border rounded shadow bg-light">
                    <h6 class="text-center text-muted mb-3">For Students Only</h6>
                    <div class="mb-3">
                        <input type="text" class="form-control" id="username" name="username" required
                            placeholder="Username">
                    </div>
                    <div class="mb-3">
                        <input type="password" class="form-control" id="password" name="password" required
                            placeholder="Password">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Sign In</button>
                    <div class="text-center mt-2">
                        <a href="/forgot-password" class="btn btn-link">Forgot Password?</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div id="modalHeader" class="modal-header text-white">
                    <h5 class="modal-title" id="modalTitle">Status</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body text-center p-4">
                    <p id="modalMessage" class="fs-5"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        const loginForm = document.getElementById('loginForm');
        const authModal = new bootstrap.Modal(document.getElementById('authModal'));

        loginForm.addEventListener('submit', function (event) {
            event.preventDefault();

            const userField = document.getElementById('username');
            const passField = document.getElementById('password');

            const modalHeader = document.getElementById('modalHeader');
            const modalTitle = document.getElementById('modalTitle');
            const modalMessage = document.getElementById('modalMessage');

            if (userField.value === "ASK" && passField.value === "1122") {
                modalHeader.classList.remove('bg-danger');
                modalHeader.classList.add('bg-success');
                modalTitle.textContent = 'Login Successful';
                modalMessage.textContent = 'Welcome to ASTU E-Student.';
                authModal.show();
                loginForm.reset();
            } else {
                modalHeader.classList.remove('bg-success');
                modalHeader.classList.add('bg-danger');
                modalTitle.textContent = 'Login Failed';
                modalMessage.textContent = 'Please enter the correct username and password.';
                authModal.show();
                loginForm.reset();
            }
        });

        document.querySelectorAll('.form-control').forEach(input => {
            input.addEventListener('input', () => {
                input.classList.remove('is-invalid', 'is-valid');
            });
        });
    </script>
</body>

</html>
